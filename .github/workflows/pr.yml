name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Policy tests and source policy (before any init)
        run: make policy

      - name: Risk gate unit tests
        run: make risk-test

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform/

      - name: terraform validate
        run: |
          for dir in terraform/bootstrap terraform/envs/dev terraform/envs/prod; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done

      - name: tflint
        run: tflint --recursive

  scan:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Checkov and guards
        run: make scan

  plan:
    name: Plan (${{ matrix.env }})
    needs: static
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/aigt-ci-plan
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pr-${{ github.event.pull_request.number }}-plan-${{ matrix.env }}

      - name: Show which role we are
        run: aws sts get-caller-identity --query Arn --output text

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan

      - name: Plan as JSON (never uploaded, contains unmasked values)
        run: terraform show -json tfplan > plan.json

      - name: Policies on the plan
        run: make -C ../../.. plan-policy PLAN=terraform/envs/${{ matrix.env }}/plan.json

      - name: Risk level
        run: make -C ../../.. risk PLAN=terraform/envs/${{ matrix.env }}/plan.json OUT=terraform/envs/${{ matrix.env }}/risk.json

      - name: Upload risk report (levels and addresses only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: risk-${{ matrix.env }}
          path: terraform/envs/${{ matrix.env }}/risk.json
          retention-days: 3
          if-no-files-found: error

      - name: Save plan as text
        run: |
          terraform show -no-color tfplan > plan.txt
          sed -i "s/${TF_VAR_aws_account_id}/***/g" plan.txt

      - name: Upload plan text
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ matrix.env }}
          path: terraform/envs/${{ matrix.env }}/plan.txt
          retention-days: 3
          if-no-files-found: error

  comment:
    name: Plan comment
    needs: plan
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download plan texts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-*
          path: plans

      - name: Create or update the plan comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tf-plan-comment -->';
            const maxChars = 30000;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);

            let body = `${marker}\n## Terraform plan for \`${sha}\`\n`;

            for (const env of ['dev', 'prod']) {
              let text = fs.readFileSync(`plans/plan-${env}/plan.txt`, 'utf8');
              const summary = (text.match(/^(Plan: .*|No changes\..*)$/m) || ['(no summary found)'])[0];
              if (text.length > maxChars) {
                text = text.slice(0, maxChars) + '\n... (truncated, full plan in the workflow run)';
              }
              body += `\n### ${env}: ${summary}\n<details><summary>Show full plan</summary>\n\n\`\`\`hcl\n${text}\n\`\`\`\n</details>\n`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  risk:
    name: Risk gate
    needs: plan
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      level: ${{ steps.level.outputs.level }}
    steps:
      - name: Download risk reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: risk-*
          path: risk

      - name: Overall risk level
        id: level
        run: |
          files=(risk/risk-*/risk.json)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "FAIL: expected 2 risk reports (dev and prod), found ${#files[@]}"
            exit 1
          fi
          level=$(jq -s -r '[.[].level] | if index("high") then "high" elif index("medium") then "medium" else "low" end' "${files[@]}")
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "Overall risk level: $level"
          {
            echo "## Risk level: $level"
            for f in "${files[@]}"; do
              env_name=$(basename "$(dirname "$f")")
              echo "### ${env_name#risk-}"
              jq -r '.reasons[] | "- **\(.level)** `\(.address)`: \(.detail) (\(.rule))"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  risk-approval:
    name: Risk approval
    needs: risk
    if: needs.risk.outputs.level == 'high'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: risk-approval
    permissions: {}
    steps:
      - name: Approved
        run: echo "High-risk plan approved by a required reviewer of the risk-approval environment."
