name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform/

      - name: terraform validate
        run: |
          for dir in terraform/bootstrap terraform/envs/dev terraform/envs/prod; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done

      - name: tflint
        run: tflint --recursive

  plan:
    name: Plan (${{ matrix.env }})
    needs: static
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.env }}
    steps:
      - name: Hide account ID in logs
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pr-${{ github.event.pull_request.number }}-plan-${{ matrix.env }}

      - name: Show which role we are
        run: aws sts get-caller-identity --query Arn --output text

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan

      - name: Save plan as text
        run: |
          terraform show -no-color tfplan > plan.txt
          sed -i "s/${{ vars.AWS_ACCOUNT_ID }}/***/g" plan.txt

      - name: Upload plan text
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ matrix.env }}
          path: terraform/envs/${{ matrix.env }}/plan.txt
          retention-days: 3
          if-no-files-found: error
