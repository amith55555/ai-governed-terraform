repos:
  # Generic hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^benchmarks/v2/  # frozen files; their SHA-256 is in benchmarks/v2-preregistration.md
      - id: end-of-file-fixer
        exclude: ^benchmarks/v2/
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Our pinned tools from mise.toml (same versions CI will use)
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -recursive terraform/
        language: system
        files: \.tf$
        pass_filenames: false

      - id: tflint
        name: tflint
        entry: tflint --recursive
        language: system
        files: \.tf$
        pass_filenames: false

      - id: gitleaks
        name: gitleaks (block secrets)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
